<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %} {% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.datatables.net/3.0.3/css/dataTables.dataTables.min.css">
  <script src="https://cdn.datatables.net/3.0.3/js/dataTables.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


</head>

<body>
  <div class="container">
    <div class="container-fluid">
      <nav class="navbar navbar-expand-lg" style="background-color: #ee13a5;">
        <div class="container-fluid">
          <img src="{{ url_for('static', filename='sokonest_logo2.png') }}" alt="SokoNest" class="logo">
          <a class="navbar-brand text-black" href="#">SokoNest</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active text-black" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-black" href="/dashboard">Dashboard</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-black" href="/products">Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-black" href="/sales">Sales</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-black" href="/stock">Stock</a>
              </li>
            </ul>
            <ul class="nav">
              <li class="nav-item">
                <a class="nav-link1 text-black" href="/login">Login</a>
              </li>
              <li class="nav-item">
                <a class="nav-link2 text-black" href="/register">Register</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>

    {% block content %}
    

    {% endblock %}
    <footer>
        <div class="container text-center">
            <h4>Sokonest</h4>
            <p>
                Simple tools for smarter businesses.
            </p>
            <small>
                © 2026 Sokonest. All rights reserved.
            </small>
            <small>
                Made by Ancy Niya
            </small>
        </div>

    </footer>
</div>


  </div>









  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>

  <script>
    new DataTable('#example');
  </script>
</body>

</html>
